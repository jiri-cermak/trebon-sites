# Shared nginx configuration included by all three server blocks.
# Based on V5 Design Specification Section 0.4.

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Cache static assets aggressively (fingerprint or version filenames for cache busting)
location /css/   { expires 1y; add_header Cache-Control "public, immutable"; }
location /js/    { expires 1y; add_header Cache-Control "public, immutable"; }
location /img/   { expires 1y; add_header Cache-Control "public, immutable"; }
location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; }

# API proxy to Previo — injects API key server-side (Phase 2)
location /api/previo/ {
    proxy_pass https://api.previo.app/rest/;
    proxy_set_header Authorization "ApiKey ${PREVIO_API_KEY}";
    proxy_set_header X-Previo-Hotel-ID "${PREVIO_HOTEL_ID}";
    proxy_set_header Content-Type "application/json";
    proxy_set_header X-Previo-Language-ID $arg_lang;
}

# API proxy to jong backend — massage booking (Phase 2)
location /api/booking/ {
    proxy_pass http://jong-api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# API proxy to nang_kwak backend — e-shop (Phase 3)
location /api/shop/ {
    proxy_pass http://nang-kwak-api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Sitemap, robots, llms.txt
location = /robots.txt { }
location = /sitemap.xml { }
location = /llms.txt { }

# 404 fallback
error_page 404 /404.html;
