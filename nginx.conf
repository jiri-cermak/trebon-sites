# Single nginx container serving all three domains via server_name routing.
# Based on V5 Design Specification Section 0.4.

# Dev / IP-based access (Tailscale) — roots at project level so shared
# css/, js/, fonts/ resolve correctly from any subdirectory.
server {
    listen 80;
    server_name 100.120.152.61 localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/shared.conf;
}

server {
    listen 80;

    server_name www.utrebonskemadony.cz utrebonskemadony.cz;
    root /usr/share/nginx/html/penzion;
    index index.html;

    include /etc/nginx/shared.conf;
}

server {
    listen 80;

    server_name www.thajskemasaze-trebon.cz thajskemasaze-trebon.cz;
    root /usr/share/nginx/html/thai;
    index index.html;

    include /etc/nginx/shared.conf;
}

server {
    listen 80;

    server_name www.masaze-trebon.cz masaze-trebon.cz;
    root /usr/share/nginx/html/masaze;
    index index.html;

    include /etc/nginx/shared.conf;
}
