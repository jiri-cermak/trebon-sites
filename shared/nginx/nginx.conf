events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Multilingual support: serve /en/ and /de/ subdirectories
        location / {
            try_files $uri $uri/ =404;
        }

        # Previo API proxy (shared across sites)
        # location /api/ {
        #     proxy_pass https://api.previo.app/;
        #     proxy_set_header Authorization "ApiKey ${PREVIO_API_KEY}";
        #     proxy_set_header Host api.previo.app;
        # }

        error_page 404 /404.html;
    }
}
