# Docker Compose — local development for trebon-sites monorepo
# Usage: docker compose -f shared/docker/docker-compose.yml up -d
#
# Production VPS setup: Caddy on host handles TLS, reverse-proxies to these
# containers on the hermes_caddy-net network.

version: "3.8"

services:
  masaze-trebon:
    build:
      context: ../../sites/masaze-trebon
      dockerfile: Dockerfile
    container_name: masaze-trebon
    networks:
      - hermes_caddy-net
    restart: unless-stopped

  thajskemasaze-trebon:
    build:
      context: ../../sites/thajskemasaze-trebon
      dockerfile: Dockerfile
    container_name: thajskemasaze
    networks:
      - hermes_caddy-net
    restart: unless-stopped

  utrebonskemadony:
    build:
      context: ../../sites/utrebonskemadony
      dockerfile: Dockerfile
    container_name: utrebonskemadony
    networks:
      - hermes_caddy-net
    restart: unless-stopped

networks:
  hermes_caddy-net:
    external: true
